name: Build and Release NightscoutTV

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build clean zip
        run: |
          zip -r NightscoutTV.zip \
            manifest \
            source/ \
            components/ \
            images/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NightscoutTV.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
